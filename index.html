<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Generador de preguntas Moodle</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,500;9..144,600&family=IBM+Plex+Mono:wght@400;500&family=IBM+Plex+Sans:wght@400;500;600&display=swap">
<style>
:root{
  --paper:#F7F3EA;
  --paper-raised:#FFFFFF;
  --paper-sunken:#EFE8D4;
  --ink:#26241F;
  --ink-soft:#635D50;
  --ink-muted:#9C9585;
  --rule:#E4DDC8;
  --rule-strong:#CBBF9C;
  --accent:#33478F;
  --accent-soft:#E7EAF6;
  --accent-ink:#1C2957;
  --correct:#3E6B4F;
  --correct-soft:#E5EEE6;
  --incorrect:#9C4A3E;
  --incorrect-soft:#F5E7E2;
  --sv-bg:#E8F4F9;
  --sv-border:#CFE3EC;
  --font-display:'Fraunces', Georgia, 'Times New Roman', serif;
  --font-body:'IBM Plex Sans', -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
  --font-mono:'IBM Plex Mono', 'SFMono-Regular', Consolas, monospace;
  color-scheme: light;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --paper:#1B1915;
    --paper-raised:#221F19;
    --paper-sunken:#171512;
    --ink:#F1ECDD;
    --ink-soft:#C6BEA8;
    --ink-muted:#8C846F;
    --rule:#3A3527;
    --rule-strong:#4C4636;
    --accent:#93A4E0;
    --accent-soft:#282E4C;
    --accent-ink:#DCE1F5;
    --correct:#8FCBA1;
    --correct-soft:#213228;
    --incorrect:#E2988A;
    --incorrect-soft:#392621;
    --sv-bg:#1D2A30;
    --sv-border:#2E434C;
    color-scheme: dark;
  }
}
:root[data-theme="dark"]{
  --paper:#1B1915;
  --paper-raised:#221F19;
  --paper-sunken:#171512;
  --ink:#F1ECDD;
  --ink-soft:#C6BEA8;
  --ink-muted:#8C846F;
  --rule:#3A3527;
  --rule-strong:#4C4636;
  --accent:#93A4E0;
  --accent-soft:#282E4C;
  --accent-ink:#DCE1F5;
  --correct:#8FCBA1;
  --correct-soft:#213228;
  --incorrect:#E2988A;
  --incorrect-soft:#392621;
  --sv-bg:#1D2A30;
  --sv-border:#2E434C;
  color-scheme: dark;
}
*{box-sizing:border-box;}
[hidden]{display:none !important;}
body{
  margin:0;
  background:var(--paper);
  color:var(--ink);
  font-family:var(--font-body);
  line-height:1.55;
}
.page{max-width:780px;margin:0 auto;padding-inline:16px;padding-block:2.5rem 4rem;}
@media (min-width:640px){ .page{padding-inline:32px;} }
.masthead{margin-bottom:1.75rem;}
.eyebrow{font-family:var(--font-mono);font-size:12px;letter-spacing:.08em;text-transform:uppercase;color:var(--accent);margin:0 0 .6rem;}
.masthead h1{font-family:var(--font-display);font-weight:600;font-size:clamp(28px,5vw,38px);margin:0 0 .5rem;text-wrap:balance;color:var(--ink);}
.lede{margin:0;max-width:58ch;color:var(--ink-soft);font-size:15px;}
.panel, .q-card, .output-panel{background:var(--paper-raised);border:1px solid var(--rule);border-radius:14px;}
.panel{padding:1.1rem 1.25rem .9rem;margin-bottom:1.5rem;}
.field{display:flex;flex-direction:column;gap:.4rem;margin-bottom:.75rem;}
.field label, .feedback-field label{font-size:13px;color:var(--ink-soft);font-weight:500;}
input[type=text], input[type=number], textarea, select{
  font:inherit;font-size:14px;color:var(--ink);background:var(--paper);
  border:1px solid var(--rule-strong);border-radius:8px;padding:.5rem .65rem;width:100%;
}
input:focus-visible, textarea:focus-visible, select:focus-visible, button:focus-visible{outline:2px solid var(--accent);outline-offset:1px;}
textarea{resize:vertical;min-height:64px;font-family:inherit;}
.format-row{display:flex;flex-wrap:wrap;gap:1.25rem;margin-bottom:.85rem;}
.format-opt{display:flex;align-items:flex-start;gap:.5rem;cursor:pointer;font-size:14px;}
.format-opt input{margin-top:.28rem;flex-shrink:0;width:auto;}
.format-opt small{display:block;color:var(--ink-muted);font-size:12px;line-height:1.4;}
.stats-bar{display:flex;flex-wrap:wrap;gap:.5rem;padding-top:.65rem;border-top:1px solid var(--rule);}
.stat-chip{font-size:12px;font-family:var(--font-mono);color:var(--ink-soft);background:var(--paper-sunken);border:1px solid var(--rule);border-radius:999px;padding:.2rem .65rem;}
.q-card{padding:1.1rem 1.25rem 1.25rem;margin-bottom:1rem;}
.q-card.unsupported{border-color:var(--rule-strong);background:var(--paper-sunken);}
.q-head{display:flex;justify-content:space-between;align-items:flex-start;gap:.75rem;margin-bottom:.9rem;flex-wrap:wrap;}
.q-head-left{display:flex;align-items:center;gap:.5rem;flex-wrap:wrap;}
.q-num{font-family:var(--font-mono);font-size:12px;font-weight:500;color:var(--accent-ink);background:var(--accent-soft);border-radius:6px;padding:.15rem .55rem;}
.q-example-badge{font-size:11px;color:var(--ink-muted);border:1px dashed var(--rule-strong);border-radius:999px;padding:.1rem .55rem;}
.q-warn{font-size:11px;color:var(--incorrect);background:var(--incorrect-soft);border-radius:999px;padding:.1rem .6rem;}
.q-head-right{display:flex;align-items:center;gap:.4rem;flex-wrap:wrap;}
.type-select{width:auto;min-width:210px;}
.icon-btn{display:inline-flex;align-items:center;justify-content:center;width:32px;height:32px;flex-shrink:0;background:transparent;border:1px solid var(--rule-strong);border-radius:8px;color:var(--ink-soft);cursor:pointer;}
.icon-btn:hover{background:var(--paper-sunken);color:var(--incorrect);}
.answer-row{display:flex;align-items:center;gap:.55rem;margin-bottom:.45rem;}
.answer-row input[type=text]{flex:1;}
.mark{flex-shrink:0;width:19px;height:19px;cursor:pointer;accent-color:var(--correct);}
.weight-tag{font-family:var(--font-mono);font-size:11px;color:var(--correct);white-space:nowrap;flex-shrink:0;}
.btn-dashed{width:100%;background:transparent;border:1px dashed var(--rule-strong);border-radius:8px;padding:.5rem;font:inherit;font-size:13px;color:var(--ink-soft);cursor:pointer;display:flex;align-items:center;justify-content:center;gap:.4rem;}
.btn-dashed:hover{background:var(--paper-sunken);}
.pair-row{display:grid;grid-template-columns:1fr auto 1fr auto;gap:.5rem;align-items:center;margin-bottom:.45rem;}
.pair-arrow{color:var(--ink-muted);font-family:var(--font-mono);}
@media (max-width:480px){ .pair-row{grid-template-columns:1fr 1fr auto;} .pair-arrow{display:none;} }
.choice-row{display:flex;gap:1.25rem;flex-wrap:wrap;margin:.25rem 0;}
.choice-row label{display:flex;align-items:center;gap:.4rem;font-size:14px;cursor:pointer;}
.choice-row input[type=radio]{width:auto;}
.num-grid{display:grid;grid-template-columns:1fr 1fr;gap:.75rem;margin-top:.4rem;}
@media (max-width:480px){ .num-grid{grid-template-columns:1fr;} }
.essay-note{font-size:13px;color:var(--ink-soft);background:var(--paper-sunken);border-radius:8px;padding:.65rem .8rem;margin:0;}
.hint{font-size:12px;color:var(--ink-muted);margin:0 0 .5rem;}
.hint code{font-family:var(--font-mono);background:var(--paper-sunken);border-radius:4px;padding:0 .25rem;}
.feedback-field{margin-top:.85rem;padding-top:.75rem;border-top:1px dashed var(--rule);display:flex;flex-direction:column;gap:.4rem;}
.gap-card{border:1px solid var(--rule);border-radius:10px;padding:.75rem .85rem;margin-bottom:.6rem;background:var(--paper-sunken);}
.gap-head{display:flex;align-items:center;gap:.5rem;margin-bottom:.6rem;flex-wrap:wrap;}
.gap-tag{font-family:var(--font-mono);font-size:12px;font-weight:500;color:var(--accent-ink);background:var(--accent-soft);border-radius:6px;padding:.1rem .5rem;}
.gap-head select{width:auto;min-width:150px;}
.opt-row{display:flex;align-items:center;gap:.5rem;margin-bottom:.45rem;}
.opt-row input[type=text]{flex:1;}
.opt-row select{width:auto;min-width:92px;}
.add-bar{display:flex;flex-wrap:wrap;gap:.6rem;margin-bottom:2rem;}
#new-type-select{flex:1;min-width:230px;}
.btn-ghost, .btn-primary{font:inherit;font-size:14px;font-weight:500;border-radius:9px;padding:.55rem 1rem;cursor:pointer;display:inline-flex;align-items:center;gap:.45rem;white-space:nowrap;}
.btn-ghost{background:transparent;color:var(--ink);border:1px solid var(--rule-strong);}
.btn-ghost:hover{background:var(--paper-sunken);}
.btn-primary{background:var(--accent);color:#fff;border:1px solid var(--accent);}
.btn-primary:hover{filter:brightness(1.08);}
.output-panel{padding:1.25rem;}
.output-head{display:flex;justify-content:space-between;align-items:baseline;gap:.5rem;flex-wrap:wrap;margin-bottom:.7rem;}
.output-head h2{font-family:var(--font-display);font-weight:600;font-size:18px;margin:0;}
.output-status{font-size:12px;font-family:var(--font-mono);color:var(--ink-soft);}
.notice{font-size:12.5px;color:var(--incorrect);background:var(--incorrect-soft);border:1px solid var(--rule);border-radius:8px;padding:.55rem .7rem;margin:0 0 .7rem;}
.code-preview{font-family:var(--font-mono);font-size:12.5px;line-height:1.65;background:var(--paper-sunken);border:1px solid var(--rule);border-radius:10px;padding:1rem;max-height:340px;overflow:auto;white-space:pre-wrap;word-break:break-word;margin:0 0 .9rem;color:var(--ink);}
.tok-name, .tok-category{color:var(--accent-ink);font-weight:500;}
.tok-correct{color:var(--correct);}
.tok-incorrect{color:var(--incorrect);}
.tok-brace{color:var(--ink-muted);}
.tok-tag{color:var(--accent);}
.tok-attr{color:var(--correct);}
.tok-cdata{color:var(--ink-muted);}
.output-actions{display:flex;flex-wrap:wrap;gap:.6rem;margin-bottom:.7rem;align-items:center;}
.sr-only{position:absolute;width:1px;height:1px;padding:0;margin:-1px;overflow:hidden;clip:rect(0,0,0,0);white-space:nowrap;border:0;}
.icon-btn.move:hover{color:var(--accent);}
.weight-tag.neg{color:var(--incorrect);}
.hint.warn{color:var(--incorrect);}
.penalty-row{display:flex;flex-direction:column;gap:.35rem;margin:0 0 .75rem;padding:.65rem .75rem;background:var(--paper-sunken);border-radius:8px;}
.penalty-row label{font-size:13px;color:var(--ink-soft);font-weight:500;}
.penalty-row .hint{margin:0;}
.fb-row{margin:-.15rem 0 .55rem 1.95rem;}
.fb-row input{font-size:13px;padding:.38rem .6rem;}
.fb-toggle{display:flex;align-items:center;gap:.45rem;font-size:13px;color:var(--ink-soft);margin-top:.7rem;cursor:pointer;}
.fb-toggle input{width:auto;}
.view-tabs{display:flex;gap:.25rem;margin-bottom:.8rem;border-bottom:1px solid var(--rule);}
.view-tab{font:inherit;font-size:13px;font-weight:500;background:transparent;border:none;border-bottom:2px solid transparent;padding:.45rem .8rem;color:var(--ink-soft);cursor:pointer;margin-bottom:-1px;}
.view-tab[aria-selected="true"]{color:var(--accent-ink);border-bottom-color:var(--accent);}
.student-view{display:flex;flex-direction:column;gap:.85rem;margin-bottom:.9rem;max-height:560px;overflow:auto;}
.sv-q{display:grid;grid-template-columns:96px minmax(0,1fr);gap:.6rem;}
@media (max-width:520px){ .sv-q{grid-template-columns:minmax(0,1fr);} }
.sv-info{font-size:12px;color:var(--ink-soft);background:var(--paper-sunken);border:1px solid var(--rule);border-radius:6px;padding:.45rem .55rem;align-self:start;}
.sv-body{background:var(--sv-bg);border:1px solid var(--sv-border);border-radius:8px;padding:.8rem 1rem;font-size:14px;line-height:1.9;}
.sv-text{margin:0 0 .5rem;}
.sv-instr{margin:0 0 .3rem;font-size:13px;color:var(--ink-soft);line-height:1.5;}
.sv-opt{display:flex;align-items:flex-start;gap:.45rem;padding:.1rem 0;cursor:pointer;line-height:1.5;}
.sv-opt input{margin-top:.25rem;width:auto;flex-shrink:0;}
.sv-body select, .sv-body input[type=text]{width:auto;display:inline-block;padding:.2rem .45rem;font-size:13.5px;vertical-align:middle;}
.sv-gap{min-width:92px;margin:0 .15rem;}
.sv-body input.sv-gap-in{width:120px;}
.sv-match{border-collapse:collapse;}
.sv-match td{padding:.2rem .7rem .2rem 0;vertical-align:middle;line-height:1.5;}
.sv-body textarea.sv-essay{min-height:90px;}
.sv-drop{display:inline-block;min-width:100px;height:1.55em;vertical-align:middle;border:1px dashed var(--rule-strong);border-radius:5px;background:var(--paper-raised);margin:0 .15rem;}
.sv-chips{display:flex;flex-wrap:wrap;gap:.4rem;margin-top:.3rem;}
.sv-chip{font-size:13px;line-height:1.5;background:var(--accent-soft);color:var(--accent-ink);border-radius:5px;padding:.15rem .6rem;}
.toast{position:fixed;left:50%;bottom:20px;transform:translateX(-50%) translateY(20px);background:var(--ink);color:var(--paper);font-size:13px;padding:.6rem 1.1rem;border-radius:10px;opacity:0;pointer-events:none;transition:opacity .2s ease, transform .2s ease;max-width:90vw;text-align:center;z-index:50;}
.toast.show{opacity:1;transform:translateX(-50%) translateY(0);}
.toast.error{background:var(--incorrect);}
</style>
</head>
<body>
<div class="page">
  <header class="masthead">
    <p class="eyebrow">GIFT y Moodle XML · Banco de preguntas</p>
    <h1>Generador de preguntas Moodle</h1>
    <p class="lede">Escribe las preguntas una sola vez y descárgalas en el formato que necesites. El código se genera y se comprueba a medida que escribes. Funciona sin conexión.</p>
  </header>

  <section class="panel" aria-label="Ajustes del examen">
    <p class="hint" style="margin-bottom:.5rem;">Formato de salida</p>
    <div class="format-row" id="format-row"></div>
    <div class="field">
      <label for="category-input">Categoría en Moodle (opcional)</label>
      <input type="text" id="category-input" placeholder="p. ej. Tema 2 · Retos demográficos" oninput="setCategory(this.value)">
    </div>
    <div class="stats-bar" id="stats-bar"></div>
  </section>

  <section id="questions-container" aria-label="Preguntas"></section>

  <div class="add-bar">
    <select id="new-type-select" aria-label="Tipo de la nueva pregunta"></select>
    <button type="button" class="btn-ghost" id="add-question-btn">Añadir pregunta</button>
    <button type="button" class="btn-ghost" id="reset-btn">Empezar de cero</button>
  </div>

  <section class="output-panel" aria-label="Código generado">
    <div class="output-head">
      <h2 id="output-title">Vista previa</h2>
      <span class="output-status" id="output-status"></span>
    </div>
    <div class="view-tabs" role="tablist" aria-label="Tipo de vista">
      <button type="button" role="tab" class="view-tab" id="tab-code" aria-selected="true" onclick="setView('code')">Código</button>
      <button type="button" role="tab" class="view-tab" id="tab-student" aria-selected="false" onclick="setView('student')">Vista del alumno</button>
    </div>
    <p class="notice" id="output-notice" hidden></p>
    <pre class="code-preview" id="code-preview" aria-live="polite"></pre>
    <div class="student-view" id="student-view" hidden></div>
    <textarea id="code-raw" class="sr-only" tabindex="-1" aria-hidden="true" readonly></textarea>
    <div class="output-actions">
      <button type="button" class="btn-ghost" id="copy-btn">Copiar código</button>
      <select id="ext-select" aria-label="Extensión del archivo" style="width:auto;"></select>
      <button type="button" class="btn-primary" id="download-btn">Descargar archivo</button>
    </div>
    <p class="hint" id="import-hint"></p>
  </section>

  <div class="toast" id="toast" role="status" aria-live="polite"></div>
</div>

<script>
const FORMATS = {
  gift: {
    label: 'GIFT',
    note: 'Texto legible y editable a mano. 7 tipos de pregunta.',
    exts: ['gift','txt'],
    hint: 'Archivo en UTF-8 sin BOM. En Moodle: Banco de preguntas → Importar → elige <strong>"formato GIFT"</strong> y sube el archivo. Si tu Moodle rechaza la extensión <code>.gift</code>, cambia el desplegable a <code>.txt</code>: el contenido es idéntico.'
  },
  xml: {
    label: 'Moodle XML',
    note: 'El formato completo: admite los 10 tipos, incluidos cloze y arrastrar y soltar.',
    exts: ['xml'],
    hint: 'Archivo en UTF-8. En Moodle: Banco de preguntas → Importar → elige <strong>"Formato XML de Moodle"</strong> y sube el archivo.'
  }
};

const TYPES = {
  multiple_single: {label:'Opción múltiple (una correcta)', formats:['gift','xml']},
  multiple_multi:  {label:'Opción múltiple (varias correctas)', formats:['gift','xml']},
  truefalse:       {label:'Verdadero / falso', formats:['gift','xml']},
  shortanswer:     {label:'Respuesta corta', formats:['gift','xml']},
  matching:        {label:'Emparejamiento', formats:['gift','xml']},
  numerical:       {label:'Numérica', formats:['gift','xml']},
  essay:           {label:'Ensayo (respuesta abierta)', formats:['gift','xml']},
  cloze:           {label:'Respuestas incrustadas (cloze)', formats:['xml']},
  gapselect:       {label:'Seleccionar palabras que faltan', formats:['xml']},
  ddwtos:          {label:'Arrastrar y soltar sobre texto', formats:['xml']}
};

const GAP_KINDS = {
  MULTICHOICE: 'Opción múltiple',
  SHORTANSWER: 'Respuesta corta',
  NUMERICAL:   'Numérica'
};

const ICON_PLUS = '<svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true"><line x1="12" y1="5" x2="12" y2="19"/><line x1="5" y1="12" x2="19" y2="12"/></svg>';
const ICON_TRASH = '<svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><polyline points="3 6 5 6 21 6"/><path d="M19 6l-1 14a2 2 0 0 1-2 2H8a2 2 0 0 1-2-2L5 6"/><path d="M10 11v6"/><path d="M14 11v6"/><path d="M9 6V4a1 1 0 0 1 1-1h4a1 1 0 0 1 1 1v2"/></svg>';

const ICON_UP = '<svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><polyline points="18 15 12 9 6 15"/></svg>';
const ICON_DOWN = '<svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><polyline points="6 9 12 15 18 9"/></svg>';

function escHtml(s){ return (s||'').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;'); }
function escAttr(s){ return escHtml(s).replace(/"/g,'&quot;'); }

const VALID_WEIGHTS = [100,90,83.33333,80,75,70,66.66667,60,50,40,33.33333,30,25,20,16.66667,14.28571,12.5,11.11111,10,5];
function snapWeight(w){
  let best = VALID_WEIGHTS[0];
  VALID_WEIGHTS.forEach(v=>{ if(Math.abs(v-w) < Math.abs(best-w)) best = v; });
  return best;
}

/* Peso de cada opción en "varias correctas". Moodle suma lo que marca el alumno
   (entre 0 y 100 %), así que sin peso negativo marcar todo da la nota máxima. */
function multiWeights(q){
  const filled = (q.answers||[]).filter(a=>a.text && a.text.trim());
  const pool = filled.length ? filled : (q.answers||[]);
  const nCorrect = pool.filter(a=>a.correct).length;
  if(!nCorrect) return {pos:0, neg:0};
  const pos = snapWeight(Number((100/nCorrect).toFixed(5)));
  let neg = 0;
  if(q.penaltyMode === 'full') neg = -100;
  else if(q.penaltyMode !== 'none') neg = -pos;
  return {pos:pos, neg:neg};
}

function answerFb(q, a){
  return (q.answerFbOn && a.fb && a.fb.trim()) ? a.fb.trim() : '';
}

/* ---------- escapado GIFT (réplica de repchar() de Moodle) ---------- */
function giftEsc(s){
  return (s||'')
    .replace(/\r/g,'')
    .replace(/\\/g,'\\\\')
    .replace(/#/g,'\\#')
    .replace(/=/g,'\\=')
    .replace(/~/g,'\\~')
    .replace(/\{/g,'\\{')
    .replace(/\}/g,'\\}')
    .replace(/:/g,'\\:')
    .replace(/\n/g,'\\n');
}
function categoryEsc(s){ return (s||'').replace(/[\r\n]+/g,' ').replace(/\\/g,'').trim(); }

/* ---------- escapado cloze: terminan la alternativa ~ # } ---------- */
function clozeEsc(s){
  return (s||'')
    .replace(/\r/g,'')
    .replace(/\n+/g,' ')
    .replace(/\\/g,'\\\\')
    .replace(/~/g,'\\~')
    .replace(/#/g,'\\#')
    .replace(/\{/g,'\\{')
    .replace(/\}/g,'\\}');
}

/* ---------- escapado XML (réplica de xml_escape() de Moodle) ---------- */
function xmlEsc(s){
  s = (s||'').replace(/\r/g,'');
  if(s === '') return '';
  if(/[&<>"]/.test(s)) return '<![CDATA[' + s.split(']]>').join(']]]]><![CDATA[>') + ']]>';
  return s;
}
function xmlText(raw, indent){
  return ' '.repeat(indent) + '<text>' + xmlEsc(raw) + '</text>\n';
}

/* ---------- modelo ---------- */
function mkAns(correct){ return {text:'', correct:correct, fb:''}; }

function makeQuestion(id, type){
  const base = {id, type, name:'', text:'', feedback:'', isExample:false};
  if(type==='multiple_single') return Object.assign(base, {answerFbOn:false, answers:[mkAns(true),mkAns(false),mkAns(false)]});
  if(type==='multiple_multi')  return Object.assign(base, {answerFbOn:false, penaltyMode:'equal', answers:[mkAns(true),mkAns(true),mkAns(false)]});
  if(type==='truefalse')       return Object.assign(base, {tf:true, answerFbOn:false, fbTrue:'', fbFalse:''});
  if(type==='shortanswer')     return Object.assign(base, {saLines:''});
  if(type==='matching')        return Object.assign(base, {pairs:[{left:'',right:''},{left:'',right:''},{left:'',right:''}]});
  if(type==='numerical')       return Object.assign(base, {numMode:'tolerance', numAnswer:'', numTolerance:'0', numMin:'', numMax:''});
  if(type==='essay')           return base;
  if(type==='cloze')           return Object.assign(base, {gaps:[makeGap()]});
  if(type==='gapselect' || type==='ddwtos') return Object.assign(base, {options:[{text:'',group:'1'},{text:'',group:'1'},{text:'',group:'1'}]});
  base.type = 'multiple_single';
  return Object.assign(base, {answerFbOn:false, answers:[mkAns(true),mkAns(false),mkAns(false)]});
}

function makeGap(){
  return {kind:'MULTICHOICE', answers:[{text:'',correct:true},{text:'',correct:false}], num:'', tol:'0'};
}

function defaultState(empty){
  if(empty) return {format:'gift', category:'', seq:0, questions:[]};
  const q1 = makeQuestion(1,'multiple_single');
  q1.text = '¿Cuál es la capital de Francia?';
  q1.answers = [{text:'París',correct:true},{text:'Londres',correct:false},{text:'Berlín',correct:false},{text:'Roma',correct:false}];
  q1.isExample = true;
  const q2 = makeQuestion(2,'truefalse');
  q2.text = 'El formato GIFT sirve para importar preguntas en el banco de preguntas de Moodle.';
  q2.tf = true;
  q2.isExample = true;
  return {format:'gift', category:'', seq:2, questions:[q1,q2]};
}

function normalizeQuestion(raw, fallbackId){
  const q = (raw && typeof raw === 'object') ? raw : {};
  const type = TYPES[q.type] ? q.type : 'multiple_single';
  const base = makeQuestion(fallbackId, type);
  base.name = typeof q.name === 'string' ? q.name : '';
  base.text = typeof q.text === 'string' ? q.text : '';
  base.feedback = typeof q.feedback === 'string' ? q.feedback : '';
  base.isExample = q.isExample === true;
  if(base.answers && Array.isArray(q.answers)){
    const answers = q.answers.filter(a=>a && typeof a==='object')
      .map(a=>({text: typeof a.text==='string'?a.text:'', correct: a.correct===true, fb: typeof a.fb==='string'?a.fb:''}));
    while(answers.length < 2) answers.push(mkAns(false));
    base.answers = answers;
  }
  if('answerFbOn' in base) base.answerFbOn = q.answerFbOn === true;
  if('penaltyMode' in base) base.penaltyMode = ['equal','full','none'].indexOf(q.penaltyMode) !== -1 ? q.penaltyMode : 'equal';
  if('fbTrue' in base){
    base.fbTrue = typeof q.fbTrue==='string' ? q.fbTrue : '';
    base.fbFalse = typeof q.fbFalse==='string' ? q.fbFalse : '';
  }
  if(base.pairs && Array.isArray(q.pairs)){
    const pairs = q.pairs.filter(p=>p && typeof p==='object')
      .map(p=>({left: typeof p.left==='string'?p.left:'', right: typeof p.right==='string'?p.right:''}));
    while(pairs.length < 3) pairs.push({left:'', right:''});
    base.pairs = pairs;
  }
  if(base.options && Array.isArray(q.options)){
    const opts = q.options.filter(o=>o && typeof o==='object')
      .map(o=>({text: typeof o.text==='string'?o.text:'', group: String(o.group||'1')}));
    while(opts.length < 1) opts.push({text:'', group:'1'});
    base.options = opts;
  }
  if(base.gaps && Array.isArray(q.gaps)){
    const gaps = q.gaps.filter(g=>g && typeof g==='object').map(g=>{
      const gap = makeGap();
      gap.kind = GAP_KINDS[g.kind] ? g.kind : 'MULTICHOICE';
      if(Array.isArray(g.answers)){
        const ans = g.answers.filter(a=>a && typeof a==='object')
          .map(a=>({text: typeof a.text==='string'?a.text:'', correct: a.correct===true}));
        while(ans.length < 1) ans.push({text:'', correct:true});
        gap.answers = ans;
      }
      gap.num = g.num != null ? String(g.num) : '';
      gap.tol = g.tol != null ? String(g.tol) : '0';
      return gap;
    });
    base.gaps = gaps.length ? gaps : [makeGap()];
  }
  if(typeof base.tf === 'boolean') base.tf = q.tf !== false;
  if(typeof base.saLines === 'string') base.saLines = typeof q.saLines==='string' ? q.saLines : '';
  if(base.numMode){
    base.numMode = q.numMode === 'range' ? 'range' : 'tolerance';
    base.numAnswer = q.numAnswer != null ? String(q.numAnswer) : '';
    base.numTolerance = q.numTolerance != null ? String(q.numTolerance) : '0';
    base.numMin = q.numMin != null ? String(q.numMin) : '';
    base.numMax = q.numMax != null ? String(q.numMax) : '';
  }
  return base;
}

function loadDraft(){
  try{
    const raw = localStorage.getItem('gift-generator-draft');
    if(!raw) return null;
    const parsed = JSON.parse(raw);
    if(!parsed || !Array.isArray(parsed.questions)) return null;
    const questions = parsed.questions.map((q,i)=>normalizeQuestion(q, i+1));
    return {
      format: FORMATS[parsed.format] ? parsed.format : 'gift',
      category: typeof parsed.category === 'string' ? parsed.category : '',
      seq: questions.length,
      questions: questions
    };
  }catch(e){ return null; }
}
function saveDraft(){
  try{ localStorage.setItem('gift-generator-draft', JSON.stringify(state)); }catch(e){}
}

let state = loadDraft() || defaultState(false);

function supported(q){ return !!(q && TYPES[q.type] && TYPES[q.type].formats.indexOf(state.format) !== -1); }
function onTextChange(){ saveDraft(); updateOutput(); }
function onStructuralChange(){ saveDraft(); renderAll(); updateOutput(); }
function findQ(id){ return state.questions.find(q=>q.id===id); }

/* ---------- acciones ---------- */
function setFormat(f){
  if(!FORMATS[f]) return;
  state.format = f;
  saveDraft(); renderTypeSelect(); renderExtSelect(); renderAll(); updateOutput();
}
function addQuestion(type){
  const id = ++state.seq;
  state.questions.push(makeQuestion(id, type));
  onStructuralChange();
  requestAnimationFrame(()=>{
    const el = document.getElementById('card-'+id);
    if(el) el.scrollIntoView({behavior:'smooth', block:'center'});
  });
}
function removeQuestion(id){ state.questions = state.questions.filter(q=>q.id!==id); onStructuralChange(); }
function setType(id, type){
  const q = findQ(id);
  if(!q) return;
  const keep = {name:q.name, text:q.text, feedback:q.feedback};
  const fresh = makeQuestion(id, type);
  Object.assign(fresh, keep);
  state.questions[state.questions.indexOf(q)] = fresh;
  onStructuralChange();
}
function syncField(id, field, val){
  const q = findQ(id);
  if(!q) return;
  q[field] = val;
  q.isExample = false;
  if(field === 'text') refreshNamePlaceholder(q);
  onTextChange();
}
function refreshNamePlaceholder(q){
  try{
    const card = document.getElementById('card-' + q.id);
    if(!card || typeof card.querySelector !== 'function') return;
    const input = card.querySelector('.name-input');
    if(input) input.placeholder = autoName(q, state.questions.indexOf(q) + 1);
  }catch(e){}
}
function syncAnswerText(id, idx, val){ const q=findQ(id); if(q){ q.answers[idx].text=val; q.isExample=false; onTextChange(); } }
function syncPair(id, idx, side, val){ const q=findQ(id); if(q){ q.pairs[idx][side]=val; q.isExample=false; onTextChange(); } }
function syncOption(id, idx, field, val){ const q=findQ(id); if(q){ q.options[idx][field]=val; q.isExample=false; onTextChange(); } }
function syncGapField(id, gi, field, val){ const q=findQ(id); if(q){ q.gaps[gi][field]=val; q.isExample=false; onTextChange(); } }
function syncGapAnswer(id, gi, ai, val){ const q=findQ(id); if(q){ q.gaps[gi].answers[ai].text=val; q.isExample=false; onTextChange(); } }
function setCategory(val){ state.category = val; onTextChange(); }
function setCorrectSingle(id, idx){ const q=findQ(id); if(q){ q.answers.forEach((a,i)=>a.correct=(i===idx)); q.isExample=false; onStructuralChange(); } }
function toggleCorrectMulti(id, idx){ const q=findQ(id); if(q){ q.answers[idx].correct=!q.answers[idx].correct; q.isExample=false; onStructuralChange(); } }
function addAnswer(id){ const q=findQ(id); if(q){ q.answers.push(mkAns(false)); onStructuralChange(); } }
function syncAnswerFb(id, idx, val){ const q=findQ(id); if(q && q.answers[idx]){ q.answers[idx].fb=val; onTextChange(); } }
function toggleAnswerFb(id){ const q=findQ(id); if(q){ q.answerFbOn = !q.answerFbOn; onStructuralChange(); } }
function setPenalty(id, mode){ const q=findQ(id); if(q){ q.penaltyMode = mode; onStructuralChange(); } }
function moveQuestion(id, dir){
  const i = state.questions.findIndex(q=>q.id===id);
  const j = i + dir;
  if(i < 0 || j < 0 || j >= state.questions.length) return;
  const tmp = state.questions[i];
  state.questions[i] = state.questions[j];
  state.questions[j] = tmp;
  onStructuralChange();
  requestAnimationFrame(()=>{
    const el = document.getElementById('card-'+id);
    if(el) el.scrollIntoView({behavior:'smooth', block:'nearest'});
  });
}
function removeAnswer(id, idx){ const q=findQ(id); if(q && q.answers.length>2){ q.answers.splice(idx,1); onStructuralChange(); } }
function addPair(id){ const q=findQ(id); if(q){ q.pairs.push({left:'',right:''}); onStructuralChange(); } }
function removePair(id, idx){
  const q=findQ(id);
  if(q && q.pairs.length>3){ q.pairs.splice(idx,1); onStructuralChange(); }
  else showToast('Moodle exige un mínimo de 3 pares en las preguntas de emparejamiento.', true);
}
function addOption(id){ const q=findQ(id); if(q){ q.options.push({text:'',group:'1'}); onStructuralChange(); } }
function removeOption(id, idx){ const q=findQ(id); if(q && q.options.length>1){ q.options.splice(idx,1); onStructuralChange(); } }
function addGap(id){ const q=findQ(id); if(q){ q.gaps.push(makeGap()); onStructuralChange(); } }
function removeGap(id, gi){ const q=findQ(id); if(q && q.gaps.length>1){ q.gaps.splice(gi,1); onStructuralChange(); } }
function setGapKind(id, gi, kind){ const q=findQ(id); if(q){ q.gaps[gi].kind=kind; onStructuralChange(); } }
function setGapCorrect(id, gi, ai){ const q=findQ(id); if(q){ q.gaps[gi].answers.forEach((a,i)=>a.correct=(i===ai)); onStructuralChange(); } }
function addGapAnswer(id, gi){ const q=findQ(id); if(q){ q.gaps[gi].answers.push({text:'',correct:false}); onStructuralChange(); } }
function removeGapAnswer(id, gi, ai){ const q=findQ(id); if(q && q.gaps[gi].answers.length>1){ q.gaps[gi].answers.splice(ai,1); onStructuralChange(); } }
function setTF(id, val){ const q=findQ(id); if(q){ q.tf=(val==='true'); q.isExample=false; onStructuralChange(); } }
function setNumMode(id, mode){ const q=findQ(id); if(q){ q.numMode=mode; onStructuralChange(); } }
function resetAll(){
  if(!confirm('¿Borrar todas las preguntas y empezar de cero?')) return;
  hardReset();
}
function hardReset(){
  const f = state.format;
  state = defaultState(true);
  state.format = FORMATS[f] ? f : 'gift';
  saveDraft(); renderAll(); updateOutput();
}

/* ---------- formulario ---------- */
function renderMarkerHint(q, etiqueta){
  return `<p class="hint">Escribe el texto con huecos numerados: <code>[[1]]</code>, <code>[[2]]</code>… Cada hueco se corresponde con ${etiqueta} de la lista, por orden.</p>`;
}

function renderCard(q, num){
  const typeOptions = Object.keys(TYPES).map(v=>{
    const ok = TYPES[v].formats.indexOf(state.format) !== -1;
    return `<option value="${v}"${q.type===v?' selected':''}>${TYPES[v].label}${ok?'':' — solo XML'}</option>`;
  }).join('');
  const ok = supported(q);
  let body = '';

  const fbToggle = `<label class="fb-toggle"><input type="checkbox" ${q.answerFbOn?'checked':''} onchange="toggleAnswerFb(${q.id})"> Retroalimentación para cada respuesta</label>`;

  if(q.type==='multiple_single' || q.type==='multiple_multi'){
    const multi = q.type==='multiple_multi';
    const w = multi ? multiWeights(q) : {pos:100, neg:0};
    const penaltyText = {
      equal: 'cada opción incorrecta marcada resta lo mismo que suma una correcta, así que marcarlas todas no puntúa.',
      full: 'marcar cualquier opción incorrecta deja la pregunta a cero.',
      none: 'las incorrectas no restan, y marcar todas las casillas da la nota máxima.'
    }[q.penaltyMode || 'equal'];
    body = `<p class="hint">${multi ? 'Marca todas las respuestas correctas.' : 'Marca la respuesta correcta.'}</p>` +
      (multi ? `<div class="penalty-row">
          <label for="pen_${q.id}">Penalización por opción incorrecta</label>
          <select id="pen_${q.id}" onchange="setPenalty(${q.id},this.value)">
            <option value="equal"${q.penaltyMode==='equal'?' selected':''}>Igual al valor de una correcta (recomendado)</option>
            <option value="full"${q.penaltyMode==='full'?' selected':''}>Total: un error anula la pregunta</option>
            <option value="none"${q.penaltyMode==='none'?' selected':''}>Sin penalización</option>
          </select>
          <p class="hint${q.penaltyMode==='none'?' warn':''}">Con esta opción, ${penaltyText}</p>
        </div>` : '') +
      q.answers.map((a,i)=>`
        <div class="answer-row">
          <input type="${multi?'checkbox':'radio'}" class="mark" ${multi ? `onchange="toggleCorrectMulti(${q.id},${i})"` : `name="correct_${q.id}" onchange="setCorrectSingle(${q.id},${i})"`} ${a.correct?'checked':''} aria-label="Marcar respuesta ${i+1} como correcta">
          <input type="text" value="${escAttr(a.text)}" placeholder="Respuesta ${i+1}" oninput="syncAnswerText(${q.id},${i},this.value)">
          ${multi ? (a.correct ? `<span class="weight-tag">${w.pos}%</span>` : (w.neg ? `<span class="weight-tag neg">${w.neg}%</span>` : '')) : ''}
          <button type="button" class="icon-btn" onclick="removeAnswer(${q.id},${i})" aria-label="Eliminar respuesta ${i+1}">${ICON_TRASH}</button>
        </div>
        ${q.answerFbOn ? `<div class="fb-row"><input type="text" value="${escAttr(a.fb||'')}" placeholder="Retroalimentación si elige la respuesta ${i+1} (opcional)" oninput="syncAnswerFb(${q.id},${i},this.value)" aria-label="Retroalimentación de la respuesta ${i+1}"></div>` : ''}`).join('') +
      `<button type="button" class="btn-dashed" onclick="addAnswer(${q.id})">${ICON_PLUS} Añadir opción</button>` +
      fbToggle;

  } else if(q.type==='truefalse'){
    body = `<div class="choice-row">
      <label><input type="radio" name="tf_${q.id}" value="true" ${q.tf?'checked':''} onchange="setTF(${q.id},'true')"> Verdadero</label>
      <label><input type="radio" name="tf_${q.id}" value="false" ${!q.tf?'checked':''} onchange="setTF(${q.id},'false')"> Falso</label>
    </div>` +
      (q.answerFbOn ? `<div class="num-grid">
        <div class="field"><label>Si responde «Verdadero» (${q.tf?'acierta':'falla'})</label><input type="text" value="${escAttr(q.fbTrue||'')}" placeholder="Opcional" oninput="syncField(${q.id},'fbTrue',this.value)"></div>
        <div class="field"><label>Si responde «Falso» (${q.tf?'falla':'acierta'})</label><input type="text" value="${escAttr(q.fbFalse||'')}" placeholder="Opcional" oninput="syncField(${q.id},'fbFalse',this.value)"></div>
      </div>` : '') +
      fbToggle;

  } else if(q.type==='shortanswer'){
    body = `<p class="hint">Una respuesta aceptada por línea. Puedes añadir varias formas válidas.</p>
      <textarea placeholder="España&#10;Reino de España" oninput="syncField(${q.id},'saLines',this.value)">${escHtml(q.saLines||'')}</textarea>`;

  } else if(q.type==='matching'){
    body = `<p class="hint">Moodle exige un mínimo de 3 pares término → definición.</p>` +
      q.pairs.map((p,i)=>`
        <div class="pair-row">
          <input type="text" value="${escAttr(p.left)}" placeholder="Término ${i+1}" oninput="syncPair(${q.id},${i},'left',this.value)">
          <span class="pair-arrow">→</span>
          <input type="text" value="${escAttr(p.right)}" placeholder="Definición ${i+1}" oninput="syncPair(${q.id},${i},'right',this.value)">
          <button type="button" class="icon-btn" onclick="removePair(${q.id},${i})" aria-label="Eliminar par ${i+1}">${ICON_TRASH}</button>
        </div>`).join('') +
      `<button type="button" class="btn-dashed" onclick="addPair(${q.id})">${ICON_PLUS} Añadir par</button>`;

  } else if(q.type==='numerical'){
    body = `<div class="choice-row">
        <label><input type="radio" name="nummode_${q.id}" value="tolerance" ${q.numMode==='tolerance'?'checked':''} onchange="setNumMode(${q.id},'tolerance')"> Valor ± margen</label>
        <label><input type="radio" name="nummode_${q.id}" value="range" ${q.numMode==='range'?'checked':''} onchange="setNumMode(${q.id},'range')"> Rango (mínimo–máximo)</label>
      </div>
      <div class="num-grid">
        ${q.numMode==='range' ? `
          <div class="field"><label>Valor mínimo</label><input type="number" step="any" value="${escAttr(q.numMin)}" oninput="syncField(${q.id},'numMin',this.value)"></div>
          <div class="field"><label>Valor máximo</label><input type="number" step="any" value="${escAttr(q.numMax)}" oninput="syncField(${q.id},'numMax',this.value)"></div>
        ` : `
          <div class="field"><label>Respuesta correcta</label><input type="number" step="any" value="${escAttr(q.numAnswer)}" oninput="syncField(${q.id},'numAnswer',this.value)"></div>
          <div class="field"><label>Margen de error (±)</label><input type="number" step="any" value="${escAttr(q.numTolerance)}" oninput="syncField(${q.id},'numTolerance',this.value)"></div>
        `}
      </div>`;

  } else if(q.type==='essay'){
    body = `<p class="essay-note">El alumno escribirá una respuesta libre que corregirás a mano en Moodle. Si quieres, usa la retroalimentación general de abajo para dejarte una respuesta modelo.</p>`;

  } else if(q.type==='gapselect' || q.type==='ddwtos'){
    const etiqueta = q.type==='gapselect' ? 'una opción' : 'una etiqueta';
    body = renderMarkerHint(q, etiqueta) +
      `<p class="hint">Las opciones de más, sin hueco asignado, funcionan como distractores. El grupo limita qué opciones puede recibir cada hueco.</p>` +
      q.options.map((o,i)=>`
        <div class="opt-row">
          <span class="gap-tag">[[${i+1}]]</span>
          <input type="text" value="${escAttr(o.text)}" placeholder="${q.type==='gapselect'?'Opción':'Etiqueta'} ${i+1}" oninput="syncOption(${q.id},${i},'text',this.value)">
          <select onchange="syncOption(${q.id},${i},'group',this.value)" aria-label="Grupo de la opción ${i+1}">
            ${['1','2','3'].map(g=>`<option value="${g}"${o.group===g?' selected':''}>Grupo ${g}</option>`).join('')}
          </select>
          <button type="button" class="icon-btn" onclick="removeOption(${q.id},${i})" aria-label="Eliminar opción ${i+1}">${ICON_TRASH}</button>
        </div>`).join('') +
      `<button type="button" class="btn-dashed" onclick="addOption(${q.id})">${ICON_PLUS} Añadir ${q.type==='gapselect'?'opción':'etiqueta'}</button>`;

  } else if(q.type==='cloze'){
    body = renderMarkerHint(q, 'un hueco') +
      q.gaps.map((g,gi)=>{
        let inner = '';
        if(g.kind==='NUMERICAL'){
          inner = `<div class="num-grid">
            <div class="field"><label>Respuesta correcta</label><input type="number" step="any" value="${escAttr(g.num)}" oninput="syncGapField(${q.id},${gi},'num',this.value)"></div>
            <div class="field"><label>Margen de error (±)</label><input type="number" step="any" value="${escAttr(g.tol)}" oninput="syncGapField(${q.id},${gi},'tol',this.value)"></div>
          </div>`;
        } else if(g.kind==='SHORTANSWER'){
          inner = `<p class="hint">Todas las respuestas escritas aquí se aceptan como correctas.</p>` +
            g.answers.map((a,ai)=>`
              <div class="opt-row">
                <input type="text" value="${escAttr(a.text)}" placeholder="Respuesta aceptada ${ai+1}" oninput="syncGapAnswer(${q.id},${gi},${ai},this.value)">
                <button type="button" class="icon-btn" onclick="removeGapAnswer(${q.id},${gi},${ai})" aria-label="Eliminar respuesta">${ICON_TRASH}</button>
              </div>`).join('') +
            `<button type="button" class="btn-dashed" onclick="addGapAnswer(${q.id},${gi})">${ICON_PLUS} Añadir respuesta aceptada</button>`;
        } else {
          inner = `<p class="hint">Marca la opción correcta del desplegable.</p>` +
            g.answers.map((a,ai)=>`
              <div class="opt-row">
                <input type="radio" class="mark" name="gap_${q.id}_${gi}" ${a.correct?'checked':''} onchange="setGapCorrect(${q.id},${gi},${ai})" aria-label="Marcar como correcta">
                <input type="text" value="${escAttr(a.text)}" placeholder="Opción ${ai+1}" oninput="syncGapAnswer(${q.id},${gi},${ai},this.value)">
                <button type="button" class="icon-btn" onclick="removeGapAnswer(${q.id},${gi},${ai})" aria-label="Eliminar opción">${ICON_TRASH}</button>
              </div>`).join('') +
            `<button type="button" class="btn-dashed" onclick="addGapAnswer(${q.id},${gi})">${ICON_PLUS} Añadir opción</button>`;
        }
        return `<div class="gap-card">
          <div class="gap-head">
            <span class="gap-tag">[[${gi+1}]]</span>
            <select onchange="setGapKind(${q.id},${gi},this.value)" aria-label="Tipo del hueco ${gi+1}">
              ${Object.keys(GAP_KINDS).map(k=>`<option value="${k}"${g.kind===k?' selected':''}>${GAP_KINDS[k]}</option>`).join('')}
            </select>
            <button type="button" class="icon-btn" onclick="removeGap(${q.id},${gi})" aria-label="Eliminar hueco ${gi+1}" style="margin-left:auto">${ICON_TRASH}</button>
          </div>
          ${inner}
        </div>`;
      }).join('') +
      `<button type="button" class="btn-dashed" onclick="addGap(${q.id})">${ICON_PLUS} Añadir hueco</button>`;
  }

  return `<article class="q-card${ok?'':' unsupported'}" id="card-${q.id}">
    <div class="q-head">
      <div class="q-head-left">
        <span class="q-num">Pregunta ${num}</span>
        ${q.isExample ? '<span class="q-example-badge">Ejemplo</span>' : ''}
        ${ok ? '' : `<span class="q-warn">No exportable en ${FORMATS[state.format].label}</span>`}
      </div>
      <div class="q-head-right">
        <button type="button" class="icon-btn move" onclick="moveQuestion(${q.id},-1)" aria-label="Subir pregunta ${num}"${num===1?' style="visibility:hidden"':''}>${ICON_UP}</button>
        <button type="button" class="icon-btn move" onclick="moveQuestion(${q.id},1)" aria-label="Bajar pregunta ${num}"${num===state.questions.length?' style="visibility:hidden"':''}>${ICON_DOWN}</button>
        <select class="type-select" onchange="setType(${q.id}, this.value)" aria-label="Tipo de pregunta ${num}">${typeOptions}</select>
        <button type="button" class="icon-btn" onclick="removeQuestion(${q.id})" aria-label="Eliminar pregunta ${num}">${ICON_TRASH}</button>
      </div>
    </div>
    <div class="field">
      <label>Nombre en el banco de preguntas (opcional)</label>
      <input type="text" class="name-input" value="${escAttr(q.name||'')}" placeholder="${escAttr(autoName(q, num))}" oninput="syncField(${q.id},'name',this.value)">
    </div>
    <div class="field">
      <label>Enunciado</label>
      <textarea placeholder="Escribe aquí la pregunta..." oninput="syncField(${q.id},'text',this.value)">${escHtml(q.text)}</textarea>
    </div>
    ${body}
    <div class="feedback-field">
      <label>Retroalimentación general (opcional)</label>
      <input type="text" value="${escAttr(q.feedback)}" placeholder="Se muestra al alumno tras responder, acierte o no" oninput="syncField(${q.id},'feedback',this.value)">
    </div>
  </article>`;
}

/* ---------- exportador GIFT ---------- */
function buildQuestionGift(q){
  if(!q || typeof q !== 'object') return null;
  const name = (q.name && q.name.trim()) ? giftEsc(q.name.trim()) : '';
  const namePart = name ? `::${name}::` : '';
  const text = giftEsc((q.text||'').trim()) || 'Pregunta sin enunciado';
  let inner = '';
  let ok = true;

  if(q.type==='multiple_single'){
    const answers = (q.answers||[]).filter(a=>a.text.trim());
    if(answers.length<2 || !answers.some(a=>a.correct)) ok=false;
    else inner = answers.map(a=>{
      const fb = answerFb(q, a);
      return `\n    ${a.correct?'=':'~'}${giftEsc(a.text.trim())}${fb ? '#'+giftEsc(fb) : ''}`;
    }).join('');
  } else if(q.type==='multiple_multi'){
    const answers = (q.answers||[]).filter(a=>a.text.trim());
    const correctCount = answers.filter(a=>a.correct).length;
    if(answers.length<2 || correctCount===0) ok=false;
    else{
      const w = multiWeights(q);
      inner = answers.map(a=>{
        const fb = answerFb(q, a);
        const weight = a.correct ? `%${w.pos}%` : (w.neg ? `%${w.neg}%` : '');
        return `\n    ~${weight}${giftEsc(a.text.trim())}${fb ? '#'+giftEsc(fb) : ''}`;
      }).join('');
    }
  } else if(q.type==='truefalse'){
    inner = q.tf ? 'TRUE' : 'FALSE';
    if(q.answerFbOn){
      const fT = (q.fbTrue||'').trim();
      const fF = (q.fbFalse||'').trim();
      const right = q.tf ? fT : fF;
      const wrong = q.tf ? fF : fT;
      if(wrong) inner += '#' + giftEsc(wrong);
      else if(right) inner += '#';
      if(right) inner += '#' + giftEsc(right);
    }
  } else if(q.type==='shortanswer'){
    const lines = (q.saLines||'').split('\n').map(l=>l.trim()).filter(Boolean);
    if(!lines.length) ok=false;
    else inner = lines.map(l=>`\n    =${giftEsc(l)}`).join('');
  } else if(q.type==='matching'){
    const pairs = (q.pairs||[]).filter(p=>p.left.trim() && p.right.trim());
    if(pairs.length<3) ok=false;
    else inner = pairs.map(p=>`\n    =${giftEsc(p.left.trim())} -> ${giftEsc(p.right.trim())}`).join('');
  } else if(q.type==='numerical'){
    if(q.numMode==='range'){
      const min = parseFloat(q.numMin), max = parseFloat(q.numMax);
      if(isNaN(min) || isNaN(max)) ok=false;
      else inner = `#${min}..${max}`;
    } else {
      const ans = parseFloat(q.numAnswer);
      const tol = parseFloat(q.numTolerance);
      if(isNaN(ans)) ok=false;
      else inner = `#${ans}:${isNaN(tol)?0:tol}`;
    }
  } else if(q.type==='essay'){
    inner = '';
  } else {
    ok = false;
  }
  if(!ok) return null;

  const multiline = inner.indexOf('\n') !== -1;
  const feedback = (q.feedback && q.feedback.trim()) ? ` ####${giftEsc(q.feedback.trim())}` : '';
  return `${namePart}${text}{${inner}${multiline?'\n':''}${feedback}}`;
}

function generateGift(){
  let out = '';
  if(state.category && state.category.trim()) out += `$CATEGORY: ${categoryEsc(state.category)}\n\n`;
  let valid = 0, incomplete = 0, unsupported = 0;
  state.questions.forEach(q=>{
    if(!supported(q)){ unsupported++; return; }
    const built = buildQuestionGift(q);
    if(built){ out += built + '\n\n'; valid++; } else incomplete++;
  });
  return {text: out, valid, incomplete, unsupported, total: state.questions.length};
}

/* ---------- exportador Moodle XML ---------- */
function autoName(q, num){
  const raw = (q.text||'')
    .replace(/\[\[\d+\]\]/g, '___')
    .replace(/\s+/g,' ')
    .trim();
  if(!raw) return 'Pregunta ' + num;
  return raw.length > 70 ? raw.slice(0,70).trim() + '…' : raw;
}
function qName(q, num){
  const manual = (q.name||'').trim();
  return manual || autoName(q, num);
}

function xmlAnswer(text, fraction, extra, feedback){
  return `    <answer fraction="${fraction}" format="html">\n` +
         xmlText(text, 6) +
         `      <feedback format="html">\n` + xmlText(feedback || '', 8) + `      </feedback>\n` +
         (extra || '') +
         `    </answer>\n`;
}

function clozeGapSyntax(g){
  if(g.kind==='NUMERICAL'){
    const n = parseFloat(g.num);
    if(isNaN(n)) return null;
    const t = parseFloat(g.tol);
    return `{1:NUMERICAL:=${n}:${isNaN(t)?0:t}}`;
  }
  const answers = (g.answers||[]).filter(a=>a.text.trim());
  if(!answers.length) return null;
  if(g.kind==='SHORTANSWER'){
    return `{1:SHORTANSWER:` + answers.map(a=>`=${clozeEsc(a.text.trim())}`).join('~') + `}`;
  }
  if(!answers.some(a=>a.correct)) return null;
  return `{1:MULTICHOICE:` + answers.map(a=>`${a.correct?'=':''}${clozeEsc(a.text.trim())}`).join('~') + `}`;
}

function buildQuestionXml(q, num){
  if(!q || typeof q !== 'object') return null;
  const type = q.type;
  let body = '';
  let questionText = (q.text||'').trim();
  if(!questionText) return null;

  if(type==='multiple_single' || type==='multiple_multi'){
    const answers = (q.answers||[]).filter(a=>a.text.trim());
    const correct = answers.filter(a=>a.correct);
    if(answers.length<2 || !correct.length) return null;
    const single = type==='multiple_single';
    const w = single ? {pos:100, neg:0} : multiWeights(q);
    body += `    <single>${single?'true':'false'}</single>\n`;
    body += `    <shuffleanswers>true</shuffleanswers>\n`;
    body += `    <answernumbering>abc</answernumbering>\n`;
    answers.forEach(a=>{
      body += xmlAnswer(a.text.trim(), a.correct ? w.pos : w.neg, '', answerFb(q, a));
    });

  } else if(type==='truefalse'){
    const fT = q.answerFbOn ? (q.fbTrue||'').trim() : '';
    const fF = q.answerFbOn ? (q.fbFalse||'').trim() : '';
    body += xmlAnswer('true', q.tf ? 100 : 0, '', fT);
    body += xmlAnswer('false', q.tf ? 0 : 100, '', fF);

  } else if(type==='shortanswer'){
    const lines = (q.saLines||'').split('\n').map(l=>l.trim()).filter(Boolean);
    if(!lines.length) return null;
    body += `    <usecase>0</usecase>\n`;
    lines.forEach(l=>{ body += xmlAnswer(l, 100); });

  } else if(type==='numerical'){
    let value, tol;
    if(q.numMode==='range'){
      const min = parseFloat(q.numMin), max = parseFloat(q.numMax);
      if(isNaN(min) || isNaN(max)) return null;
      value = (min + max) / 2;
      tol = Math.abs(max - min) / 2;
    } else {
      value = parseFloat(q.numAnswer);
      if(isNaN(value)) return null;
      tol = parseFloat(q.numTolerance);
      if(isNaN(tol)) tol = 0;
    }
    body += xmlAnswer(String(value), 100, `      <tolerance>${tol}</tolerance>\n`);

  } else if(type==='matching'){
    const pairs = (q.pairs||[]).filter(p=>p.left.trim() && p.right.trim());
    if(pairs.length<3) return null;
    body += `    <shuffleanswers>true</shuffleanswers>\n`;
    pairs.forEach(p=>{
      body += `    <subquestion format="html">\n`;
      body += xmlText(p.left.trim(), 6);
      body += `      <answer>\n` + xmlText(p.right.trim(), 8) + `      </answer>\n`;
      body += `    </subquestion>\n`;
    });

  } else if(type==='essay'){
    body += `    <responseformat>editor</responseformat>\n`;
    body += `    <responserequired>1</responserequired>\n`;
    body += `    <responsefieldlines>10</responsefieldlines>\n`;
    body += `    <attachments>0</attachments>\n`;
    body += `    <attachmentsrequired>0</attachmentsrequired>\n`;
    body += `    <graderinfo format="html">\n` + xmlText('', 6) + `    </graderinfo>\n`;
    body += `    <responsetemplate format="html">\n` + xmlText('', 6) + `    </responsetemplate>\n`;

  } else if(type==='gapselect' || type==='ddwtos'){
    const opts = (q.options||[]).filter(o=>o.text.trim());
    if(!opts.length) return null;
    if(!/\[\[\d+\]\]/.test(questionText)) return null;
    const tag = type==='gapselect' ? 'selectoption' : 'dragbox';
    body += `    <shuffleanswers>1</shuffleanswers>\n`;
    opts.forEach(o=>{
      body += `    <${tag}>\n`;
      body += xmlText(o.text.trim(), 6);
      body += `      <group>${o.group||'1'}</group>\n`;
      body += `    </${tag}>\n`;
    });

  } else if(type==='cloze'){
    const gaps = q.gaps || [];
    if(!gaps.length) return null;
    let failed = false;
    gaps.forEach((g,i)=>{
      const syn = clozeGapSyntax(g);
      if(syn === null){ failed = true; return; }
      const marker = new RegExp('\\[\\[' + (i+1) + '\\]\\]', 'g');
      if(!marker.test(questionText)) { failed = true; return; }
      questionText = questionText.replace(new RegExp('\\[\\[' + (i+1) + '\\]\\]', 'g'), syn);
    });
    if(failed) return null;

  } else {
    return null;
  }

  const xmlType = {
    multiple_single:'multichoice', multiple_multi:'multichoice', truefalse:'truefalse',
    shortanswer:'shortanswer', numerical:'numerical', matching:'matching', essay:'essay',
    cloze:'cloze', gapselect:'gapselect', ddwtos:'ddwtos'
  }[type];

  let out = `  <question type="${xmlType}">\n`;
  out += `    <name>\n` + xmlText(qName(q, num), 6) + `    </name>\n`;
  out += `    <questiontext format="html">\n` + xmlText(questionText, 6) + `    </questiontext>\n`;
  out += `    <generalfeedback format="html">\n` + xmlText((q.feedback||'').trim(), 6) + `    </generalfeedback>\n`;
  if(xmlType !== 'cloze') out += `    <defaultgrade>1</defaultgrade>\n`;
  out += `    <penalty>0.3333333</penalty>\n`;
  out += `    <hidden>0</hidden>\n`;
  out += body;
  out += `  </question>\n`;
  return out;
}

function generateXml(){
  let inner = '';
  let valid = 0, incomplete = 0, unsupported = 0;
  if(state.category && state.category.trim()){
    inner += `  <question type="category">\n`;
    inner += `    <category>\n` + xmlText('$course$/' + categoryEsc(state.category), 6) + `    </category>\n`;
    inner += `  </question>\n`;
  }
  state.questions.forEach((q,i)=>{
    if(!supported(q)){ unsupported++; return; }
    const built = buildQuestionXml(q, i+1);
    if(built){ inner += built; valid++; } else incomplete++;
  });
  const text = valid ? `<?xml version="1.0" encoding="UTF-8"?>\n<quiz>\n${inner}</quiz>\n` : '';
  return {text, valid, incomplete, unsupported, total: state.questions.length};
}

function generateOutput(){
  return state.format === 'xml' ? generateXml() : generateGift();
}

/* ---------- resaltado ---------- */
function highlightGift(raw){
  let h = escHtml(raw);
  h = h.replace(/^(\$CATEGORY:.*)$/gm, '<span class="tok-category">$1</span>');
  h = h.replace(/(::[^:\n][^:\n]*::)/g, '<span class="tok-name">$1</span>');
  h = h.replace(/\{(TRUE|T)\}/g, '{<span class="tok-correct">$1</span>}');
  h = h.replace(/\{(FALSE|F)\}/g, '{<span class="tok-incorrect">$1</span>}');
  h = h.replace(/\{(#[^{}]*)\}/g, '{<span class="tok-correct">$1</span>}');
  h = h.replace(/^(\s*)(=[^\n]*)$/gm, '$1<span class="tok-correct">$2</span>');
  h = h.replace(/^(\s*)(~[^\n]*)$/gm, '$1<span class="tok-incorrect">$2</span>');
  h = h.replace(/([{}])/g, '<span class="tok-brace">$1</span>');
  return h;
}
function highlightXml(raw){
  let h = escHtml(raw);
  h = h.replace(/(&lt;!\[CDATA\[)([\s\S]*?)(\]\]&gt;)/g, '<span class="tok-cdata">$1</span>$2<span class="tok-cdata">$3</span>');
  h = h.replace(/(&lt;\/?)([a-zA-Z?!][\w:-]*)/g, '$1<span class="tok-tag">$2</span>');
  h = h.replace(/(\s)([a-zA-Z-]+)(=&quot;|=")/g, '$1<span class="tok-attr">$2</span>$3');
  return h;
}

/* ---------- vista del alumno ---------- */
let viewMode = 'code';

function setView(v){
  viewMode = (v === 'student') ? 'student' : 'code';
  document.getElementById('tab-code').setAttribute('aria-selected', viewMode === 'code' ? 'true' : 'false');
  document.getElementById('tab-student').setAttribute('aria-selected', viewMode === 'student' ? 'true' : 'false');
  document.getElementById('code-preview').hidden = viewMode !== 'code';
  document.getElementById('student-view').hidden = viewMode !== 'student';
  updateOutput();
}

function svText(s){ return escHtml(s || '').replace(/\n/g, '<br>'); }
function svFilled(arr){ return (arr || []).filter(a => a && a.text && a.text.trim()); }
function svSort(list){ return list.slice().sort((a,b)=>a.localeCompare(b, 'es')); }

function renderStudentQuestion(q){
  const name = 'sv' + q.id;
  switch(q.type){
    case 'multiple_single':
    case 'multiple_multi': {
      const multi = q.type === 'multiple_multi';
      return `<p class="sv-text">${svText(q.text)}</p>
        <p class="sv-instr">${multi ? 'Seleccione una o más:' : 'Seleccione una:'}</p>` +
        svFilled(q.answers).map((a,i)=>`<label class="sv-opt"><input type="${multi?'checkbox':'radio'}" name="${name}"><span>${String.fromCharCode(97+i)}. ${svText(a.text)}</span></label>`).join('');
    }
    case 'truefalse':
      return `<p class="sv-text">${svText(q.text)}</p><p class="sv-instr">Seleccione una:</p>
        <label class="sv-opt"><input type="radio" name="${name}"><span>Verdadero</span></label>
        <label class="sv-opt"><input type="radio" name="${name}"><span>Falso</span></label>`;
    case 'shortanswer':
    case 'numerical':
      return `<p class="sv-text">${svText(q.text)}</p><label>Respuesta: <input type="text"></label>`;
    case 'matching': {
      const pairs = (q.pairs || []).filter(p => p.left.trim() && p.right.trim());
      const opts = '<option>Elegir…</option>' + svSort(pairs.map(p => p.right.trim())).map(r => `<option>${escHtml(r)}</option>`).join('');
      return `<p class="sv-text">${svText(q.text)}</p><table class="sv-match">` +
        pairs.map(p => `<tr><td>${svText(p.left)}</td><td><select>${opts}</select></td></tr>`).join('') + '</table>';
    }
    case 'essay':
      return `<p class="sv-text">${svText(q.text)}</p><textarea class="sv-essay" rows="5"></textarea>`;
    case 'cloze': {
      let t = svText(q.text);
      (q.gaps || []).forEach((g, gi) => {
        const ctl = g.kind === 'MULTICHOICE'
          ? '<select class="sv-gap"><option></option>' + svFilled(g.answers).map(a => `<option>${escHtml(a.text)}</option>`).join('') + '</select>'
          : '<input type="text" class="sv-gap sv-gap-in">';
        t = t.split('[[' + (gi+1) + ']]').join(ctl);
      });
      return `<p class="sv-text">${t}</p>`;
    }
    case 'gapselect': {
      const opts = svFilled(q.options);
      const t = svText(q.text).replace(/\[\[(\d+)\]\]/g, (m, d) => {
        const ref = opts[parseInt(d, 10) - 1];
        const group = ref ? (ref.group || '1') : '1';
        const choices = svSort(opts.filter(o => (o.group || '1') === group).map(o => o.text.trim()));
        return '<select class="sv-gap"><option></option>' + choices.map(c => `<option>${escHtml(c)}</option>`).join('') + '</select>';
      });
      return `<p class="sv-text">${t}</p>`;
    }
    case 'ddwtos': {
      const t = svText(q.text).replace(/\[\[\d+\]\]/g, '<span class="sv-drop"></span>');
      return `<p class="sv-text">${t}</p><div class="sv-chips">` +
        svFilled(q.options).map(o => `<span class="sv-chip">${escHtml(o.text)}</span>`).join('') + '</div>';
    }
  }
  return '';
}

function renderStudentView(){
  const list = state.questions.filter(q => supported(q));
  if(!list.length) return '<p class="hint">Aquí verás las preguntas aproximadamente como las encontrará el alumno.</p>';
  return '<p class="hint" style="margin:0;">Aproximación a cómo lo mostrará Moodle. Moodle baraja el orden de las opciones; aquí aparecen tal como las escribiste.</p>' +
    list.map(q => {
      let inner = '';
      try{ inner = renderStudentQuestion(q); }catch(e){ inner = '<p class="hint">No se puede previsualizar esta pregunta.</p>'; }
      return `<div class="sv-q"><div class="sv-info">Pregunta ${state.questions.indexOf(q)+1}</div><div class="sv-body">${inner}</div></div>`;
    }).join('');
}

function updateOutput(){
  const r = generateOutput();
  if(viewMode === 'student'){
    document.getElementById('student-view').innerHTML = renderStudentView();
  }
  const fmt = FORMATS[state.format];
  document.getElementById('output-title').textContent = 'Vista previa ' + fmt.label;
  const preview = document.getElementById('code-preview');
  preview.innerHTML = r.text.trim()
    ? (state.format === 'xml' ? highlightXml(r.text) : highlightGift(r.text))
    : '<span style="color:var(--ink-muted)">Tu código aparecerá aquí a medida que completes preguntas.</span>';
  document.getElementById('code-raw').value = r.text;

  const statusEl = document.getElementById('output-status');
  if(r.total === 0) statusEl.textContent = 'Sin preguntas';
  else statusEl.textContent = `${r.valid} de ${r.total} preguntas listas`;

  const notice = document.getElementById('output-notice');
  const avisos = [];
  if(r.incomplete) avisos.push(`${r.incomplete} pregunta${r.incomplete>1?'s':''} sin completar (faltan respuestas o huecos por definir).`);
  if(r.unsupported) avisos.push(`${r.unsupported} pregunta${r.unsupported>1?'s':''} de un tipo que ${fmt.label} no admite: cambia a Moodle XML para incluirla${r.unsupported>1?'s':''}.`);
  if(avisos.length){ notice.innerHTML = avisos.join(' '); notice.hidden = false; }
  else notice.hidden = true;

  document.getElementById('import-hint').innerHTML = fmt.hint;
  renderStats();
}

/* ---------- salida ---------- */
let toastTimer = null;
function showToast(msg, isError){
  const el = document.getElementById('toast');
  el.textContent = msg;
  el.classList.toggle('error', !!isError);
  el.classList.add('show');
  clearTimeout(toastTimer);
  toastTimer = setTimeout(()=>{ el.classList.remove('show'); }, 3800);
}
function slug(s){
  const cleaned = (s||'').normalize('NFD').replace(/[̀-ͯ]/g,'').replace(/[^a-zA-Z0-9]+/g,'_').replace(/^_+|_+$/g,'').toLowerCase();
  return cleaned || 'examen';
}
async function copyCode(){
  const r = generateOutput();
  if(!r.valid){ showToast('Añade al menos una pregunta completa antes de copiar.', true); return; }
  try{
    await navigator.clipboard.writeText(r.text);
    showToast('Código copiado al portapapeles.');
  }catch(e){
    try{
      const ta = document.getElementById('code-raw');
      ta.focus(); ta.select();
      if(!document.execCommand('copy')) throw new Error('copy failed');
      showToast('Código copiado al portapapeles.');
    }catch(e2){
      showToast('No se pudo copiar automáticamente. Selecciona el texto de la vista previa a mano.', true);
    }
  }
}
function downloadCode(){
  const r = generateOutput();
  if(!r.valid){ showToast('Añade al menos una pregunta completa antes de descargar.', true); return; }
  const extEl = document.getElementById('ext-select');
  const exts = FORMATS[state.format].exts;
  const ext = (extEl && exts.indexOf(extEl.value) !== -1) ? extEl.value : exts[0];
  const filename = slug(state.category && state.category.trim() ? state.category : 'examen') + '.' + ext;
  try{
    const blob = new Blob([r.text], {type:'text/plain;charset=utf-8'});
    const url = URL.createObjectURL(blob);
    const a = document.createElement('a');
    a.href = url; a.download = filename;
    document.body.appendChild(a);
    a.click();
    document.body.removeChild(a);
    setTimeout(()=>URL.revokeObjectURL(url), 1000);
    showToast('Archivo ' + filename + ' descargado.');
  }catch(e){
    showToast('No se pudo descargar. Prueba con "Copiar código".', true);
  }
}

/* ---------- arranque ---------- */
document.getElementById('category-input').value = state.category || '';
document.getElementById('add-question-btn').addEventListener('click', ()=>{
  const sel = document.getElementById('new-type-select');
  if(sel.value) addQuestion(sel.value);
});
document.getElementById('reset-btn').addEventListener('click', resetAll);
document.getElementById('copy-btn').addEventListener('click', copyCode);
document.getElementById('download-btn').addEventListener('click', downloadCode);

renderFormatRow();
renderTypeSelect();
renderExtSelect();
renderAll();
updateOutput();
</script>
